    <style>
        :root {
            --bg-body: #f4f2f9; --bg-card: #ffffff; --primary: #7c3aed; --primary-hover: #6d28d9;
            --primary-light: #ede9fe; --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
            --danger: #ef4444; --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 2rem 1rem; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 1200px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .title h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .title p { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; color: var(--primary); transition: opacity 0.3s;
        }
        .spinner {
            border: 4px solid var(--primary-light); border-top: 4px solid var(--primary);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toolbar { background: var(--bg-card); padding: 1rem 1.5rem; border-radius: 12px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .tool-group { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; flex-grow: 1; }
        .input-box { display: flex; flex-direction: column; gap: 0.25rem; }
        .input-box label { font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
        input[type="date"], select, input[type="text"] { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.875rem; outline: none; background-color: #f8fafc; transition: 0.2s; }
        
        #buscadorAlumnos { min-width: 200px; }

        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .btn-excel { background-color: #107c41; color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        
        .table-card { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
        .table-responsive { width: 100%; overflow-x: auto; max-height: 60vh; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th { background-color: #f8fafc; color: var(--text-muted); font-size: 0.75rem; padding: 1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        tr:hover td { background-color: #fcfbfd; }
        
        td[contenteditable="true"] { border-radius: 6px; border: 1px dashed transparent; transition: 0.2s; }
        td[contenteditable="true"]:hover { border-color: var(--primary); background: var(--primary-light); cursor: text; }
        td[contenteditable="true"]:focus { outline: none; border-color: var(--primary); background: #fff; border-style: solid; }
        
        .check-cell { text-align: center; }
        input[type="checkbox"] { width: 1.4rem; height: 1.4rem; border-radius: 4px; border: 2px solid var(--border); appearance: none; outline: none; cursor: pointer; position: relative; }
        input[type="checkbox"]:checked { background-color: var(--primary); border-color: var(--primary); }
        input[type="checkbox"]:checked::after { content: ''; position: absolute; left: 6px; top: 2px; width: 6px; height: 12px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 50; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: var(--bg-card); width: 100%; max-width: 400px; border-radius: 12px; padding: 1.5rem; transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-body { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; }

            position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white;

            box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 1000;
        }
        #toast-guardado.show { transform: translateY(0); opacity: 1; }

</head>

<div id="loader">
    <div class="spinner"></div>
    <span id="loader-text">Conectando a la nube...</span>
</div>

<div id="toast-guardado">✅ Cambio guardado en la nube</div>

<div class="app-container">
    <div class="header">
        <div class="title">
            <h1>Panel de Asistencia Cloud</h1>
            <p>Escolarizado y Sabatino en un solo lugar.</p>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-danger" onclick="inyectarTodosLosAlumnos()" style="font-size:12px;">⚠️ Subir 189 alumnos a Nube</button>
            <button class="btn btn-outline" onclick="abrirModal()">+ Agregar Alumno</button>
        </div>
    </div>
    
    <div class="toolbar">
        <div class="tool-group">
            <div class="input-box">
                <label>Buscar</label>
                <input type="text" id="buscadorAlumnos" placeholder="Nombre o matrícula..." onkeyup="renderizarTabla()">
            </div>
            <div class="input-box">
                <label>Modalidad</label>
                <select id="filtroModalidad" onchange="actualizarFiltros()">
                    <option value="ESCOLARIZADO">Escolarizado</option>
                    <option value="SABATINO">Sabatino</option>
                </select>
            </div>
            <div class="input-box">
                <label>Carrera</label>
                <select id="filtroCarrera" onchange="renderizarTabla()">
                    <option value="todas">Todas</option>
                </select>
            </div>
            <div class="input-box">
                <label>Fecha</label>
                <input type="date" id="fechaSeleccionada" onchange="cargarAsistenciasDelDia()">
            </div>
        </div>
        <button class="btn btn-excel" onclick="descargarExcelAcumulativo()">
            📥 Exportar Excel
        </button>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Alumno (Click para editar)</th>
                        <th>Matrícula</th>
                        <th>Carrera</th>
                        <th class="check-cell">Asistencia</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Agregar -->
<div class="modal-overlay" id="modalAgregar">

        </div>
        <div class="modal-body">
            <div class="input-box">
                <label>Nombre</label>
                <input type="text" id="nuevoNombre">
            </div>
            <div class="input-box">
                <label>Matrícula</label>
                <input type="text" id="nuevaMatricula" placeholder="(Opcional)">
            </div>
            <div class="input-box">
                <label>Modalidad</label>
                <select id="nuevaModalidad">
                    <option value="ESCOLARIZADO">Escolarizado</option>
                    <option value="SABATINO">Sabatino</option>
                </select>
            </div>
            <div class="input-box">
                <label>Carrera</label>
                <input type="text" id="nuevaCarrera">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarNuevoAlumnoBD()">Guardar</button>
        </div>
    </div>
</div>

                let al = padronOriginal[i];
                let mat = al.Matrícula ? al.Matrícula.trim() : ("SAB_SN_" + i); // Matrícula ficticia si no tiene
                
                await window.setDoc(window.doc(window.db, "alumnos", mat), {
                    Nombre: al.Nombre,
                    Matricula: al.Matrícula || "", // Guardamos campo vacío si no tiene
                    Carrera: (al.Carrera || '').trim().toUpperCase(),
                    Modalidad: al.Modalidad
                });
            }
            alert("✅ ¡Éxito! Base de datos actualizada con 189 alumnos.");
            await cargarPadronMaestro();
        } catch(e) {
            alert("Error al subir: " + e.message);
        } finally {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
        }
    };

    async function cargarPadronMaestro() {
        const snapshot = await window.getDocs(window.collection(window.db, "alumnos"));
        baseAlumnos = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            baseAlumnos.push({ 
                idFirestore: doc.id, 
                Nombre: data.Nombre, 
                Matricula: data.Matricula, 
                Carrera: data.Carrera,
                Modalidad: data.Modalidad || "ESCOLARIZADO" 
            });
        });
        baseAlumnos.sort((a,b) => a.Nombre.localeCompare(b.Nombre)); 
        actualizarFiltros();
        renderizarTabla();
    }

    window.cargarAsistenciasDelDia = async function() {
        const fecha = document.getElementById('fechaSeleccionada').value;
        if(!fecha) return;
        asistenciaHoy = {};
        const docSnap = await window.getDoc(window.doc(window.db, "asistencias", fecha));
        if (docSnap.exists()) asistenciaHoy = docSnap.data().registros || {};
        renderizarTabla();
    };

    window.marcarAsistenciaCloud = async function(idAlumno, valorBool) {
        const fecha = document.getElementById('fechaSeleccionada').value;
        if(!asistenciaHoy[idAlumno]) asistenciaHoy[idAlumno] = { p1: false };
        asistenciaHoy[idAlumno].p1 = valorBool;

        await window.setDoc(window.doc(window.db, "asistencias", fecha), { registros: asistenciaHoy }, { merge: true });
    };

    window.limpiarEdicion = function(event) {
        if(event.key === 'Enter') { event.preventDefault(); event.target.blur(); }
    };

    window.guardarEdicionCloud = async function(idFirestore, campo, elementoHtml) {
        const nuevoValor = elementoHtml.innerText.trim();
        const alumno = baseAlumnos.find(a => a.idFirestore === idFirestore);
        
        if(alumno) {
            if(alumno[campo] === nuevoValor) return; 
            alumno[campo] = (campo === 'Carrera') ? nuevoValor.toUpperCase() : nuevoValor;
        }

        try {
            await window.updateDoc(window.doc(window.db, "alumnos", idFirestore), {
                [campo]: (campo === 'Carrera') ? nuevoValor.toUpperCase() : nuevoValor
            });
            mostrarToast();
            if(campo === 'Carrera') actualizarFiltros();
        } catch(e) { console.error(e); }
    };

    function mostrarToast() {
        const toast = document.getElementById('toast-guardado');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    window.guardarNuevoAlumnoBD = async function() {
        const nom = document.getElementById('nuevoNombre').value.trim();
        const mat = document.getElementById('nuevaMatricula').value.trim();
        const mod = document.getElementById('nuevaModalidad').value;
        const car = document.getElementById('nuevaCarrera').value.trim().toUpperCase();

        if(!nom || !car) return alert("Nombre y carrera son obligatorios.");
        const idDoc = mat ? mat : ("NEW_SN_" + new Date().getTime());

        await window.setDoc(window.doc(window.db, "alumnos", idDoc), { Nombre: nom, Matricula: mat, Carrera: car, Modalidad: mod });

        await cargarPadronMaestro();
        cerrarModal();
    };

    // Actualizamos las opciones de Carrera basándonos en la Modalidad elegida
    window.actualizarFiltros = function() {
        const modal = document.getElementById('filtroModalidad').value;
        const selectCar = document.getElementById('filtroCarrera');
        const filtroAntiguo = selectCar.value;

        // Filtramos alumnos por la modalidad activa
        const alumnosModalidad = baseAlumnos.filter(a => a.Modalidad === modal);
        const carrerasUnicas = [...new Set(alumnosModalidad.map(a => a.Carrera))].sort();
        
        let html = '<option value="todas">Todas</option>';
        carrerasUnicas.forEach(c => html += `<option value="${c}">${c}</option>`);
        selectCar.innerHTML = html;
        
        // Mantener seleccionada la carrera si existe en la nueva modalidad
        if(carrerasUnicas.includes(filtroAntiguo)) selectCar.value = filtroAntiguo;
        
        renderizarTabla();
    };

    window.renderizarTabla = function() {
        const tbody = document.getElementById('tabla-cuerpo');
        const fMod = document.getElementById('filtroModalidad').value;
        const fCar = document.getElementById('filtroCarrera').value;
        const search = document.getElementById('buscadorAlumnos').value.toLowerCase();
        
        tbody.innerHTML = '';
        
        let filtrados = baseAlumnos.filter(a => a.Modalidad === fMod);
        if(fCar !== 'todas') filtrados = filtrados.filter(a => a.Carrera === fCar);
        
        if(search !== "") {
            filtrados = filtrados.filter(a => 
                a.Nombre.toLowerCase().includes(search) || 
                (a.Matricula && a.Matricula.toLowerCase().includes(search))
            );
        }

        if(filtrados.length === 0){
            tbody.innerHTML = `<tr><td colspan="4" class="text-center" style="padding:2rem;">No se encontraron resultados.</td></tr>`;
            return;
        }

        filtrados.forEach(alumno => {
            const asis = asistenciaHoy[alumno.idFirestore] || {p1: false};
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td contenteditable="true" spellcheck="false" onblur="guardarEdicionCloud('${alumno.idFirestore}', 'Nombre', this)" onkeydown="limpiarEdicion(event)">${alumno.Nombre}</td>
                <td contenteditable="true" spellcheck="false" onblur="guardarEdicionCloud('${alumno.idFirestore}', 'Matricula', this)" onkeydown="limpiarEdicion(event)">${alumno.Matricula || '---'}</td>
                <td contenteditable="true" spellcheck="false" onblur="guardarEdicionCloud('${alumno.idFirestore}', 'Carrera', this)" onkeydown="limpiarEdicion(event)"><span class="badge">${alumno.Carrera}</span></td>
                <td class="check-cell"><input type="checkbox" ${asis.p1 ? 'checked' : ''} onchange="marcarAsistenciaCloud('${alumno.idFirestore}', this.checked)"></td>
            `;
            tbody.appendChild(tr);
        });
    };

    window.abrirModal = () => document.getElementById('modalAgregar').classList.add('active');
    window.cerrarModal = () => document.getElementById('modalAgregar').classList.remove('active');

    // EXCEL: Ahora genera un reporte dependiendo de la Modalidad Seleccionada
    window.descargarExcelAcumulativo = async function() {
        document.getElementById('loader-text').innerText = "Generando Excel oficial...";
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('loader').style.opacity = '1';

        try {
            const meses = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
            const hoy = new Date();
            const anioStr = hoy.getFullYear();
            const mesStr = meses[hoy.getMonth()];

            const snapshotAsist = await window.getDocs(window.collection(window.db, "asistencias"));
            let historial = {};
            let fechasRegistradas = [];

            snapshotAsist.forEach(doc => {
                fechasRegistradas.push(doc.id);
                historial[doc.id] = doc.data().registros;
            });
            fechasRegistradas.sort();

            const wb = XLSX.utils.book_new();
            
            // Verificamos qué modalidad estamos viendo en pantalla
            const modalActiva = document.getElementById('filtroModalidad').value;
            const tituloTabla = modalActiva === 'SABATINO' ? "ASISTENCIA NI ESCOLARIZADO" : "LICENCIATURA:";
            
            const fCar = document.getElementById('filtroCarrera').value;
            let carreras = fCar === 'todas' 
                ? [...new Set(baseAlumnos.filter(a=>a.Modalidad===modalActiva).map(a => a.Carrera))].sort() 
                : [fCar];

            carreras.forEach(carrera => {
                const alumnosCar = baseAlumnos.filter(a => a.Modalidad === modalActiva && a.Carrera === carrera);
                let headerNombres = ["N.P.", "MATRICULA", "NOMBRE"];
                
                fechasRegistradas.forEach(fecha => {
                    const diaNum = parseInt(fecha.split('-')[2], 10);
                    headerNombres.push(diaNum); 
                });

                const dataHoja = [
                    [null, tituloTabla, modalActiva === 'SABATINO' ? "" : carrera], // Ajuste de título
                    [null, "GRUPO:", ""],
                    [null, "MATERIA:", ""],
                    [null, "DOCENTE:", ""],
                    [null, "TURNO:", modalActiva === 'SABATINO' ? "SABATINO" : "ESCOLARIZADO"],
                    [null, "PERIODO:", anioStr.toString(), mesStr],
                    [], 
                    headerNombres 
                ];

                alumnosCar.forEach((alumno, idx) => {
                    let filaAlumno = [idx + 1, alumno.Matricula || "", alumno.Nombre];
                    fechasRegistradas.forEach(fecha => {
                        const recsDia = historial[fecha] || {};
                        const asisAlumno = recsDia[alumno.idFirestore] || {p1: false};
                        filaAlumno.push(asisAlumno.p1 ? 1 : 0);
                    });
                    dataHoja.push(filaAlumno);
                });
                
                const ws = XLSX.utils.aoa_to_sheet(dataHoja);
                let colWidths = [{wch: 5}, {wch: 15}, {wch: 45}];
                fechasRegistradas.forEach(() => { colWidths.push({wch: 6}); });
                ws['!cols'] = colWidths;

                // El nombre de la pestaña será la carrera
                XLSX.utils.book_append_sheet(wb, ws, carrera.substring(0, 31));
            });

            XLSX.writeFile(wb, `Asistencia_${modalActiva}_${mesStr}.xlsx`);
            
        } catch (error) {
            console.error(error);
            alert("Error generando Excel.");
        } finally {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 300);
        }
    }
</script>
